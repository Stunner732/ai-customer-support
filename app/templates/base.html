<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support Dashboard{% endblock %} &middot; Harbor &amp; Pine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #166534;
      --primary-hover: #15803d;
      --radius: 10px;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; }
    body { min-height: 100vh; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    input, textarea, select, button { font-family: inherit; font-size: inherit; color: var(--text); }
    button { cursor: pointer; border: none; background: transparent; color: inherit; }
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* Layout & text utilities */
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .muted { color: var(--muted); }
    .fw-bold { font-weight: 700; }
    .block { display: block; }
    .w-full { width: 100%; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .items-start { align-items: flex-start; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 0.5rem; }
    .gap-0-5 { gap: 0.25rem; }
    .space-y > * + * { margin-top: 0.75rem; }
    .mt-0 { margin-top: 0; }
    .mt-0-5 { margin-top: 0.25rem; }
    .mt-1 { margin-top: 0.75rem; }
    .mb-0 { margin-bottom: 0; }
    .mb-0-5 { margin-bottom: 0.25rem; }
    .mb-1 { margin-bottom: 0.75rem; }
    .pt-0-5 { padding-top: 0.25rem; }
    .border-t { border-top: 1px solid var(--border); }

    /* Grid */
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .two-col { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 1024px) { .two-col { grid-template-columns: 1fr 340px; } }
    .sticky { position: sticky; }
    .top-1 { top: 1rem; }
    .align-start { align-self: start; }

    /* Navbar */
    header { position: sticky; top: 0; z-index: 50; background: rgba(248, 250, 252, 0.8); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
    .navbar { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0.625rem 1rem; }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.125rem; color: var(--text); }
    .brand-badge { width: 26px; height: 26px; border-radius: 6px; background: var(--primary); display: grid; place-items: center; color: #fff; font-size: 0.85rem; line-height: 1; }
    .nav-links { display: flex; gap: 0.125rem; }
    .nav-links a { padding: 0.5rem 0.875rem; border-radius: var(--radius); color: var(--muted); font-weight: 500; font-size: 0.9rem; border: 1px solid transparent; }
    .nav-links a:hover { background: #f1f5f9; color: var(--text); }
    .nav-links a.active { background: #f0fdf4; color: var(--primary); border-color: #bbf7d0; }
    .nav-actions { display: flex; align-items: center; gap: 0.5rem; }
    .poller-pill { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.75rem; border-radius: 999px; background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    .poller-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2); }

    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; letter-spacing: -0.01em; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-body { padding: 1.25rem; }
    details > summary { padding: 1rem 1.25rem; font-weight: 600; font-size: 0.95rem; cursor: pointer; list-style: none; }
    details > summary::-webkit-details-marker { display: none; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; border-radius: 8px; font-weight: 500; font-size: 0.9rem; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { color: #dc2626; border-color: #fca5a5; }
    .btn-danger:hover { background: #fee2e2; color: #991b1b; }
    .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.85rem; }

    /* Forms */
    .field { display: flex; flex-direction: column; gap: 0.375rem; }
    .form-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .form-input { width: 100%; padding: 0.55rem 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: #fff; }
    .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.1); }
    textarea.form-input { resize: vertical; font-family: inherit; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; font-weight: 600; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    tr:hover td { background: #f8fafc; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: #f0fdf4; }

    /* Status pills */
    .status-pill { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0.7rem; border-radius: 999px; border: 1px solid var(--border); background: #fff; font-size: 0.8rem; font-weight: 500; color: var(--text); text-decoration: none; }
    .status-pill.active { background: #f0fdf4; color: var(--primary); border-color: #bbf7d0; }
    .status-pill-inline { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .status-escalated { background: #fff7ed; color: #92400e; border-color: #f59e0b; }
    .status-answered { background: #d1fae5; color: #065f46; border-color: #10b981; }
    .status-open { background: #dbeafe; color: #1d4ed8; border-color: #3b82f6; }
    .status-resolved { background: #e2e8f0; color: #475569; border-color: #94a3b8; }
    .status-badge { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
    .status-badge.status-escalated { background: #fff7ed; color: #92400e; }
    .status-badge.status-answered { background: #d1fae5; color: #065f46; }
    .status-badge.status-open { background: #dbeafe; color: #1d4ed8; }
    .status-badge.status-resolved { background: #e2e8f0; color: #475569; }
    .section-tag { display: inline-flex; align-items: center; padding: 0.15rem 0.5rem; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 0.75rem; color: var(--muted); }

    /* Summary cards (KPI row) */
    .summary-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.625rem; }
    .summary-card { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; padding: 0.75rem 1rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); text-decoration: none; color: var(--text); position: relative; overflow: hidden; }
    .summary-card:hover { border-color: var(--primary); background: #f0fdf4; }
    .summary-card.active { background: #f0fdf4; border-color: var(--primary); }
    .summary-card .top-border { position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: var(--radius) var(--radius) 0 0; opacity: 0.9; }
    .summary-card .count { font-size: 1.75rem; font-weight: 700; }
    .summary-card .label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .summary-card.active .label, .summary-card:hover .label { color: var(--primary); }
    .top-border-all { background: var(--primary); }
    .top-border-escalated { background: #f59e0b; }
    .top-border-open { background: #3b82f6; }
    .top-border-answered { background: #10b981; }
    .top-border-resolved { background: #94a3b8; }

    /* Alert */
    .alert { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.875rem 1rem; border-radius: var(--radius); font-size: 0.9rem; }
    .alert-amber { background: #fef3c7; border: 1px solid #f59e0b; color: #92400e; }
    .alert strong { display: block; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.125rem; }

    /* Transcript */
    .transcript { display: flex; flex-direction: column; gap: 0.75rem; border-radius: var(--radius); border: 1px solid var(--border); background: #fff; padding: 0.75rem; max-height: 560px; overflow-y: auto; }
    .msg { display: flex; flex-direction: column; gap: 0.25rem; max-width: 78%; padding: 0.6rem 0.85rem; border-radius: 10px; font-size: 0.875rem; border: 1px solid var(--border); }
    .msg-inbound { align-self: flex-start; background: #f1f5f9; border-color: #cbd5e1; }
    .msg-outbound { align-self: flex-end; background: #dcfce7; border-color: #86efac; }
    .msg-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); font-weight: 500; }
    .msg-body { white-space: pre-wrap; margin: 0; color: var(--text); }

    .detail-table { width: 100%; font-size: 0.85rem; border-collapse: collapse; }
    .detail-table td { padding: 0.5rem 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .detail-table td.label { color: var(--muted); font-size: 0.75rem; width: 30%; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
    .detail-table tr:last-child td { border-bottom: none; }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <header>
    <div class="navbar">
      <div class="brand">
        <span class="brand-badge">H&amp;P</span> Harbor &amp; Pine Support
      </div>
      <nav class="nav-links">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
        <a href="/kb" class="{% if request.url.path == '/kb' %}active{% endif %}">Knowledge Base</a>
      </nav>
      <div class="nav-actions">
        <span class="poller-pill"><span class="poller-dot" aria-hidden="true"></span>Poller Active</span>
      </div>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
