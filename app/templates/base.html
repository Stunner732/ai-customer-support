<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    nav { padding: 0.5rem 1rem; border-bottom: 1px solid #ddd; }
    nav ul { margin: 0; }
    main { padding: 1rem; }
    .pill-tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .status-pill { border: 1px solid #ccc; border-radius: 999px; padding: 0.25rem 0.75rem; text-decoration: none; }
    .status-pill.active { background: #1095c1; color: #fff; border-color: #1095c1; }
    .status-open { color: #1095c1; }
    .status-answered { color: #2e7d32; }
    .status-escalated { color: #d32f2f; font-weight: bold; }
    .status-resolved { color: #757575; }
    .summary-cards { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
    .summary-card { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem 1.25rem; min-width: 110px; text-align: center; }
    .summary-card .count { font-size: 1.6rem; font-weight: bold; display: block; }
    table { font-size: 0.9rem; }
    .msg { border-radius: 8px; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; border: 1px solid #ddd; }
    .msg.outbound { background: #e8f5e9; }
    .msg.inbound { background: #e3f2fd; }
    .msg .meta { font-size: 0.75rem; color: #666; }
    .msg pre { white-space: pre-wrap; margin: 0.25rem 0 0; font-family: inherit; }
    article { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><strong>AI Support</strong></li>
    </ul>
    <ul>
      <li><a href="/">Dashboard</a></li>
      <li><a href="/kb">Knowledge Base</a></li>
    </ul>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
